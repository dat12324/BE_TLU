services:
  backend:
    build: .
    container_name: tluphone-be
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - http
      - --url=https://yummy-alias-abreast.ngrok-free.dev
      - backend:5000
    depends_on:
      - backend
    restart: unless-stopped